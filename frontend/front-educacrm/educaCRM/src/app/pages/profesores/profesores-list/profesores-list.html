<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Profesores</h4>
  <div class="d-flex gap-2">
    <div class="input-group" style="max-width: 320px">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input class="form-control" placeholder="Buscar…" [(ngModel)]="q" />
    </div>

    @if (roleService.canCreate('profesores')) {
    <button class="btn btn-success" (click)="abrirModal(true)">
      <i class="bi bi-plus-lg"></i> Nuevo
    </button>
    }
  </div>
</div>

<app-crud-table
  [data]="filtrados()"
  [columns]="columns"
  [actions]="actions"
  emptyMessage="Sin resultados"
>
</app-crud-table>

<app-generic-modal
  #modalProfesor
  [title]="modoEdicion ? 'Editar profesor' : 'Nuevo profesor'"
  [confirmText]="modoEdicion ? 'Guardar cambios' : 'Añadir profesor'"
  headerClass="bg-success text-white"
  confirmBtnClass="btn-success"
  (confirm)="guardar()"
>
  <form>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input
          class="form-control"
          [(ngModel)]="actual.nombre"
          name="nombre"
          required
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Apellidos</label>
        <input
          class="form-control"
          [(ngModel)]="actual.apellidos"
          name="apellidos"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Departamento</label>
        <select
          class="form-select"
          name="departamentoId"
          [(ngModel)]="actual.departamentoId"
        >
          <option [ngValue]="null">— Sin departamento —</option>
          @for (d of departamentos; track d.id) {
          <option [ngValue]="d.id">{{ d.nombre }}</option>
          }
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="actual.email"
          name="email"
        />
      </div>
    </div>
  </form>
</app-generic-modal>
