<h4 class="mb-3">Panel principal</h4>

<div class="row g-3">
  @for (c of cards(); track c.title) {
    <div class="col-12 col-md-6 col-xl-4">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <h6 class="card-title">{{ c.title }}</h6>
          <p class="text-muted small mb-3 flex-grow-1">{{ c.desc }}</p>
          <a [routerLink]="c.link" class="btn btn-sm btn-primary mt-auto">Abrir</a>
        </div>
      </div>
    </div>
  }
</div>
