<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de calificaciones</h3>
    <div class="d-flex gap-2">
      <div class="input-group" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" placeholder="Buscar calificación…" [(ngModel)]="q">
      </div>
      @if (roleService.canCreate('calificaciones')) {
        <button class="btn btn-success" (click)="abrirModal(true)">
          <i class="bi bi-plus-lg"></i> Nueva calificación
        </button>
      }
    </div>
  </div>

  <app-crud-table
    [data]="view()"
    [columns]="columns"
    [actions]="actions">
  </app-crud-table>

  <app-generic-modal
    #modalCalificacion
    [title]="modoEdicion ? 'Editar Calificación' : 'Nueva Calificación'"
    (onSave)="guardar()">
    <form #formCalificacion="ngForm">
      <div class="mb-3">
        <label for="alumnoId" class="form-label">ID Alumno</label>
        <input type="number" class="form-control" [(ngModel)]="actual.alumnoId" name="alumnoId" required>
      </div>
      <div class="mb-3">
        <label for="asignaturaId" class="form-label">ID Asignatura</label>
        <input type="number" class="form-control" [(ngModel)]="actual.asignaturaId" name="asignaturaId" required>
      </div>
      <div class="mb-3">
        <label for="nota" class="form-label">Nota</label>
        <input type="number" class="form-control" [(ngModel)]="actual.nota" name="nota" required min="0" max="10" step="0.1">
      </div>
      <div class="mb-3">
        <label for="evaluacion" class="form-label">Evaluación</label>
        <select class="form-select" [(ngModel)]="actual.evaluacion" name="evaluacion" required>
          <option value="Primera">Primera</option>
          <option value="Segunda">Segunda</option>
          <option value="Tercera">Tercera</option>
          <option value="Final">Final</option>
        </select>
      </div>
    </form>
  </app-generic-modal>
</div>
