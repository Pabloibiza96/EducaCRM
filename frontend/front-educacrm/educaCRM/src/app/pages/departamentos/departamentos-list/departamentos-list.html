<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Departamentos</h4>
  <div class="d-flex gap-2">
    <div class="input-group" style="max-width: 320px;">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input class="form-control" placeholder="Buscar…" [(ngModel)]="q" />
    </div>

    @if (roleService.canCreate('departamentos')) {
      <button class="btn btn-success" (click)="abrirModal(true)">
        <i class="bi bi-plus-lg"></i> Nuevo
      </button>
    }
  </div>
</div>

<app-crud-table
  [data]="filtrados()"
  [columns]="columns"
  [actions]="actions"
  emptyMessage="No hay departamentos">
</app-crud-table>

<app-generic-modal 
  #modalDept
  [title]="modoEdicion ? 'Editar departamento' : 'Nuevo departamento'"
  [confirmText]="modoEdicion ? 'Guardar cambios' : 'Crear departamento'"
  headerClass="bg-secondary text-white"
  confirmBtnClass="btn-secondary"
  (confirm)="guardar()">

  <form>
    <div class="mb-3">
      <label class="form-label">Nombre del departamento <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="actual.nombre"
        name="nombre"
        required
        minlength="2"
        maxlength="100">
    </div>
  </form>
</app-generic-modal>
