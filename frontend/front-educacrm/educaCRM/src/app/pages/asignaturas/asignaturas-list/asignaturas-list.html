<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de asignaturas</h3>
    <div class="d-flex gap-2">
      <div class="input-group" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" placeholder="Buscar asignatura…" [(ngModel)]="q">
      </div>
      @if (roleService.canCreate('asignaturas')) {
        <button class="btn btn-success" (click)="abrirModal(true)">
          <i class="bi bi-plus-lg"></i> Nueva asignatura
        </button>
      }
    </div>
  </div>

  <app-crud-table
    [data]="filtrados()"
    [columns]="columns"
    [actions]="actions"
    emptyMessage="No hay asignaturas registradas">
  </app-crud-table>

  <!-- Modal -->
  <app-generic-modal
    #modalAsignatura
    [title]="modoEdicion ? 'Editar asignatura' : 'Nueva asignatura'"
    [confirmText]="modoEdicion ? 'Guardar cambios' : 'Crear asignatura'"
    headerClass="bg-secondary text-white"
    confirmBtnClass="btn-secondary"
    (confirm)="guardar()">

    <form>
      <div class="mb-3">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="actual.nombre"
          name="nombre"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Código <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="actual.codigo"
          name="codigo"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Curso</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="actual.curso"
          name="curso"
          placeholder="Ej: 1º ESO, 2º DAW…">
      </div>
    </form>
  </app-generic-modal>
</div>
