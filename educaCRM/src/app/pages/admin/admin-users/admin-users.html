<div class="container mt-4">
  <h2 class="mb-4">Administrar Usuarios</h2>

  <button class="btn btn-primary mb-3" (click)="abrirModal(true)">
    <i class="bi bi-plus-circle"></i> Nuevo Usuario
  </button>

  <input
    class="form-control mb-3"
    [(ngModel)]="q"
    placeholder="Buscar usuario..."
  />

  <ng-template #rolBadgeTpl let-row>
    <span class="badge" [ngClass]="getRolBadgeClass(row.rol)">
      {{ row.rol }}
    </span>
  </ng-template>

  <ng-template #activoBadgeTpl let-row>
    <span class="badge" [ngClass]="row.activo ? 'bg-success' : 'bg-secondary'">
      {{ row.activo ? 'Activo' : 'Inactivo' }}
    </span>
  </ng-template>

  <app-crud-table
    [data]="filtrados()"
    [columns]="columns"
    [actions]="actions"
  />

  <app-generic-modal
    #modalUsuario
    [title]="modoEdicion ? 'Editar Usuario' : 'Nuevo Usuario'"
    (onSave)="guardar()"
  >
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input class="form-control" [(ngModel)]="actual.username" />
    </div>
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" [(ngModel)]="actual.nombre" />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" [(ngModel)]="actual.email" />
    </div>
    <div class="mb-3">
      <label class="form-label">Rol</label>
      <select class="form-control" [(ngModel)]="actual.rol">
        @for (rol of roles; track rol) {
          <option [value]="rol">{{ rol }}</option>
        }
      </select>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        [(ngModel)]="actual.activo"
        id="checkActivo"
      />
      <label class="form-check-label" for="checkActivo">Activo</label>
    </div>
  </app-generic-modal>
</div>
