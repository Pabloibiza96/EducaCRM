<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de alumnos</h3>
    <div class="d-flex gap-2">
      <div class="input-group" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" placeholder="Buscar alumno…" [(ngModel)]="q">
      </div>
      @if (roleService.canCreate('alumnos')) {
        <button class="btn btn-success" (click)="abrirModal(true)">
          <i class="bi bi-plus-lg"></i> Nuevo alumno
        </button>
      }
    </div>
  </div>

  <!-- Tabla genérica -->
  <app-crud-table
    [data]="filtrados()"
    [columns]="columns"
    [actions]="actions">
  </app-crud-table>

  <!-- Modal de edición -->
  <app-generic-modal
    #modalAlumno
    [title]="modoEdicion ? 'Editar Alumno' : 'Nuevo Alumno'"
    (onSave)="guardar()">
    <form #formAlumno="ngForm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="actual.nombre" name="nombre" required>
      </div>
      <div class="mb-3">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input type="text" class="form-control" [(ngModel)]="actual.apellidos" name="apellidos" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="actual.email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="grupo" class="form-label">Grupo</label>
        <input type="text" class="form-control" [(ngModel)]="actual.grupo" name="grupo" required>
      </div>
    </form>
  </app-generic-modal>
</div>
