<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de alumnos</h3>
    <div class="d-flex gap-2">
      <div class="input-group" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" placeholder="Buscar alumno…" [(ngModel)]="q">
      </div>
      <button class="btn btn-success" (click)="abrirModal(true)">
        <i class="bi bi-plus-lg"></i> Nuevo alumno
      </button>
    </div>
  </div>

  <!-- Tabla genérica -->
  <app-crud-table
    [data]="filtrados()"
    [columns]="columns"
    [actions]="actions"
    emptyMessage="No hay alumnos registrados">
  </app-crud-table>
</div>

<!-- Modal -->
<app-generic-modal 
  #modalAlumno
  [title]="modoEdicion ? 'Editar alumno' : 'Nuevo alumno'"
  [confirmText]="modoEdicion ? 'Guardar cambios' : 'Crear alumno'"
  headerClass="bg-info text-white"
  confirmBtnClass="btn-info"
  (confirm)="guardar()">
  
  <form (ngSubmit)="guardar()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="actual.nombre" name="nombre" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Apellidos <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="actual.apellidos" name="apellidos" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" [(ngModel)]="actual.email" name="email" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Grupo</label>
        <input type="text" class="form-control" [(ngModel)]="actual.grupo" name="grupo" placeholder="Ej: 1º DAW">
      </div>
    </div>
  </form>
  
</app-generic-modal>
