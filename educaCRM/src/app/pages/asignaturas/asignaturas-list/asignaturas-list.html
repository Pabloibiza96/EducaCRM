<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Asignaturas</h4>
  <div class="d-flex gap-2">
    <div class="input-group" style="max-width: 320px;">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input class="form-control" placeholder="Buscar…" [(ngModel)]="q" />
    </div>
    <button class="btn btn-success" (click)="abrirModal(true)">
      <i class="bi bi-plus-lg"></i> Nueva asignatura
    </button>
  </div>
</div>

<!-- Tabla genérica -->
<app-crud-table
  [data]="filtrados()"
  [columns]="columns"
  [actions]="actions"
  emptyMessage="Sin resultados">
</app-crud-table>

<!-- Modal Genérico -->
<app-generic-modal 
  #modalAsignatura
  [title]="modoEdicion ? 'Editar asignatura' : 'Nueva asignatura'"
  [confirmText]="modoEdicion ? 'Guardar cambios' : 'Añadir asignatura'"
  headerClass="bg-warning text-dark"
  confirmBtnClass="btn-warning"
  (confirm)="guardar()">
  
  <form (ngSubmit)="guardar()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Código</label>
        <input class="form-control" [(ngModel)]="actual.codigo" name="codigo" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input class="form-control" [(ngModel)]="actual.nombre" name="nombre" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Curso</label>
        <input class="form-control" [(ngModel)]="actual.curso" name="curso" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Profesor (opcional)</label>
        <input class="form-control" [(ngModel)]="actual.profesor" name="profesor">
      </div>
    </div>
  </form>
  
</app-generic-modal>
