<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold text-light" routerLink="/">EducaCRM</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div id="navbarContent" class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      @for (link of links(); track link.path) {
        @if (user() && link.roles.includes(user()?.role || '')) {
          <li class="nav-item">
            <a class="nav-link text-light" [routerLink]="link.path">{{ link.label }}</a>
          </li>
        }
      }
    </ul>

    <ul class="navbar-nav ms-auto">
      @if (user()) {
        <li class="nav-item text-light me-3">
          Hola, <strong>{{ user()?.name }}</strong>
        </li>
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-light" (click)="logout()">Cerrar sesión</button>
        </li>
      } @else {
        <li class="nav-item">
          <a class="btn btn-sm btn-light" routerLink="/login">Iniciar sesión</a>
        </li>
      }
    </ul>
  </div>
</nav>
