<nav class="navbar navbar-expand-lg bg-light border-bottom px-3">
  <a class="navbar-brand fw-bold" routerLink="/">EducaCRM</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div id="navContent" class="collapse navbar-collapse show">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      @if (auth.currentUser()) {
        @for (link of links; track link.path) {
          @if (canSee(link.roles)) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
                 [routerLinkActiveOptions]="{ exact: link.path === '/' }">{{ link.label }}</a>
            </li>
          }
        }
      }
    </ul>

    <ul class="navbar-nav ms-auto">
      @if (auth.currentUser()) {
        <li class="nav-item d-flex align-items-center me-2">
          <span class="text-muted small">Hola, <strong>{{ auth.currentUser()?.username }}</strong></span>
        </li>
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-danger" (click)="logout()">Salir</button>
        </li>
      } @else {
        <li class="nav-item">
          <a class="btn btn-sm btn-outline-primary" routerLink="/login">Login</a>
        </li>
      }
    </ul>
  </div>
</nav>
